{% extends "base.html" %}

{% block content %}

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center text-success">
    <i class="bi bi-shield-lock-fill"></i> Admin Login
</h2>

<hr>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
    Username
</label>

<input
    type="text"
    class="form-control"
    name="username"
    placeholder="Enter Username"
    required>

</div>

<div class="mb-3">

<label class="form-label">
    Password
</label>

<div class="input-group">

<input
    type="password"
    class="form-control"
    id="password"
    name="password"
    placeholder="Enter Password"
    required>

<span
    class="input-group-text"
    onclick="togglePassword()"
    style="cursor:pointer;">

    <i
        class="bi bi-eye"
        id="eyeIcon">
    </i>

</span>

</div>

</div>

<button
    type="submit"
    class="btn btn-success w-100">

    Login

</button>

</form>

</div>

</div>

</div>

</div>

<script>

function togglePassword() {

    let password =
        document.getElementById("password");

    let eye =
        document.getElementById("eyeIcon");

    if (password.type === "password") {

        password.type = "text";

        eye.className =
            "bi bi-eye-slash";

    } else {

        password.type = "password";

        eye.className =
            "bi bi-eye";
    }

}

</script>

{% endblock %}
