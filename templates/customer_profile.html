{% extends "customer_base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">
                <i class="bi bi-person-circle me-2"></i>
                My Profile
            </h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Customer ID
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ customer.customer_id }}"
                        readonly>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ customer.customer_name }}"
                        readonly>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ customer.mobile_no }}"
                        readonly>

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Address
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ customer.address }}"
                        readonly>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
