{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DairyFlow Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-success text-white p-3"
         style="width:260px; min-height:100vh;">

        <h3 class="text-center mb-4">
            <i class="bi bi-droplet-fill"></i>
            DairyFlow
        </h3>

        <hr>

        <div class="nav flex-column">

            <a href="{% url 'dashboard' %}" class="nav-link text-white mb-2">
                <i class="bi bi-house-door-fill me-2"></i>
                Dashboard
            </a>

            <a href="{% url 'customer_list' %}" class="nav-link text-white mb-2">
                <i class="bi bi-people-fill me-2"></i>
                Customer
            </a>

            <a href="{% url 'milk_entry_list' %}" class="nav-link text-white mb-2">
                <i class="bi bi-droplet-half me-2"></i>
                Milk Entry
            </a>

            <a href="{% url 'monthly_bill' %}" class="nav-link text-white mb-2">
                <i class="bi bi-receipt me-2"></i>
                Monthly Bill
            </a>

            <a href="#" class="nav-link text-white mb-2">
                <i class="bi bi-bar-chart-fill me-2"></i>
                Reports
            </a>

            <a href="{% url 'bill_history' %}" class="nav-link text-white">

                <i class="bi bi-clock-history me-2"></i>

                Bill History

            </a>
            
            <hr>

            <a href="#" class="nav-link text-white">
                <i class="bi bi-box-arrow-right me-2"></i>
                Logout
            </a>

        </div>

    </div>

    <!-- Main Content -->
    <div class="flex-grow-1">

        <!-- Header -->
        <nav class="navbar navbar-light bg-light shadow-sm px-4">
            <span class="navbar-brand mb-0 h4">
                DairyFlow Admin Panel
            </span>
        </nav>

        <!-- Messages -->
        <div class="container mt-3">

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success alert-dismissible fade show">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        </div>

        <!-- Page Content -->
        <div class="container-fluid p-4">

            {% block content %}

            {% endblock %}

        </div>

        <!-- Footer -->
        <footer class="bg-light text-center py-3 mt-5 border-top">
            © 2026 DairyFlow | All Rights Reserved
        </footer>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
