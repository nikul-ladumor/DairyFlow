{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DairyFlow Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="{% static 'css/admin.css' %}">





</head>


<body>

<div class="d-flex">


    <!-- =================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar" id="adminSidebar">

            <!-- MOBILE CLOSE BUTTON -->
            <button type="button"
                    class="mobile-sidebar-close"
                    onclick="closeAdminSidebar()">
                <i class="bi bi-x-lg"></i>
            </button>

        <!-- LOGO -->

        <div class="sidebar-logo">

            <img src="{% static 'images/logo.jpeg' %}"
                 alt="DairyFlow Logo">

        </div>


        <hr>


        <!-- =================================
             MENU
        ================================== -->

        <div class="sidebar-nav">


            <!-- =========================
                 DASHBOARD
            ========================== -->

            <a href="{% url 'dashboard' %}"
               class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

                <i class="bi bi-house-door-fill"></i>

                Dashboard

            </a>


            <!-- =========================
                 CUSTOMER
            ========================== -->

            <a href="{% url 'customer_list' %}"
               class="{% if request.resolver_match.url_name == 'customer_list' or request.resolver_match.url_name == 'add_customer' or request.resolver_match.url_name == 'edit_customer' or request.resolver_match.url_name == 'delete_customer' %}active{% endif %}">

                <i class="bi bi-people-fill"></i>

                Customer

            </a>


            <!-- =========================
                 MILK ENTRY
            ========================== -->

            <a href="{% url 'milk_entry_list' %}"
               class="{% if request.resolver_match.url_name == 'milk_entry_list' or request.resolver_match.url_name == 'add_milk_entry' or request.resolver_match.url_name == 'edit_milk_entry' or request.resolver_match.url_name == 'delete_milk_entry' %}active{% endif %}">

                <i class="bi bi-droplet-half"></i>

                Milk Entry

            </a>


            <!-- =========================
                 MONTHLY BILL
            ========================== -->

            <a href="{% url 'monthly_bill' %}"
               class="{% if request.resolver_match.url_name == 'monthly_bill' or request.resolver_match.url_name == 'generate_bill' or request.resolver_match.url_name == 'bill_report' %}active{% endif %}">

                <i class="bi bi-receipt"></i>

                Monthly Bill

            </a>


            <!-- =========================
                 REPORTS
            ========================== -->

            <a href="#"
               class="{% if request.resolver_match.url_name == 'reports' %}active{% endif %}">

                <i class="bi bi-bar-chart-fill"></i>

                Reports

            </a>


            <!-- =========================
                 BILL HISTORY
            ========================== -->

            <a href="{% url 'bill_history' %}"
               class="{% if request.resolver_match.url_name == 'bill_history' or request.resolver_match.url_name == 'delete_bill' %}active{% endif %}">

                <i class="bi bi-clock-history"></i>

                Bill History

            </a>


        </div>


        <!-- =================================
             LOGOUT
        ================================== -->

        <div class="sidebar-bottom">

            <hr>

            <a href="{% url 'admin_logout' %}">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>


    </aside>

    <!-- MOBILE OVERLAY -->

    <div class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="closeAdminSidebar()">
    </div>


    <!-- =================================
         MAIN CONTENT
    ================================== -->

    <main class="main-content flex-grow-1">


    <!-- MOBILE TOP BAR -->

    <div class="mobile-topbar">

        <button type="button"
                class="mobile-menu-btn"
                onclick="openAdminSidebar()">

            <i class="bi bi-list"></i>

        </button>

        <span class="mobile-title">
            DairyFlow Admin
        </span>

    </div>

        <!-- Messages -->

        <div class="container-fluid mt-3 px-4">

            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-success alert-dismissible fade show">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        </div>


        <!-- Page Content -->

        <div class="page-content">

            {% block content %}

            {% endblock %}

        </div>


        <!-- Footer -->

        <footer class="text-center text-muted py-3 mt-4 border-top">

            © 2026 DairyFlow | All Rights Reserved

        </footer>


    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<script src="{% static 'js/admin.js' %}"></script>

</body>

</html>
