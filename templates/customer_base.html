{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DairyFlow Customer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            background: #f8f9fa;
        }

        /* Sidebar */

        .customer-sidebar {

            width: 260px;
            min-height: 100vh;

            background: #198754;

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            color: white;

            display: flex;
            flex-direction: column;

        }

        /* Logo */

        .customer-logo {

            text-align: center;

            padding: 10px;

        }

        .customer-logo img {

            width: 145px;

            height: auto;

        }

        .customer-sidebar hr {

            margin: 5px 15px 15px;

            border-color:
                rgba(255,255,255,0.25);

        }

        /* Menu */

        .customer-menu {

            padding: 0 10px;

        }

        .customer-menu a {

            display: flex;

            align-items: center;

            color: white;

            text-decoration: none;

            padding: 11px 12px;

            margin-bottom: 5px;

            border-radius: 8px;

            font-weight: 500;

        }

        .customer-menu a i {

            width: 24px;

            margin-right: 8px;

        }

        /* Hover */

        .customer-menu a:hover {

            background:
                rgba(0,0,0,0.12);

            color: #ffc107;

        }

        .customer-menu a:hover i {

            color: #ffc107;

        }

        /* Active */

        .customer-menu a.active {

            background:
                rgba(0,0,0,0.18);

            color: #ffc107;

        }

        .customer-menu a.active i {

            color: #ffc107;

        }

        /* Logout */

        .customer-logout {

            margin-top: auto;

            padding: 10px;

        }

        .customer-logout a {

            display: flex;

            align-items: center;

            color: white;

            text-decoration: none;

            padding: 11px 12px;

            border-radius: 8px;

        }

        .customer-logout a:hover {

            background:
                rgba(0,0,0,0.12);

            color: #ffc107;

        }

        /* Main */

        .customer-main {

            margin-left: 260px;

            min-height: 100vh;

        }

        /* Header */

        .customer-header {

            height: 65px;

            background: white;

            box-shadow: 0 2px 5px
                       rgba(0,0,0,0.08);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

        }

        .customer-header-title {

            font-size: 20px;

            font-weight: 600;

        }

        .customer-content {

            padding: 25px;

        }

    </style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="customer-sidebar">


    <!-- Logo -->

    <div class="customer-logo">

        <img src="{% static 'images/logo.jpeg' %}"
             alt="DairyFlow Logo">

    </div>


    <hr>


    <!-- Menu -->

    <div class="customer-menu">


        <!-- Dashboard -->

        <a href="{% url 'customer_dashboard' %}"
           class="{% if request.resolver_match.url_name == 'customer_dashboard' %}active{% endif %}">

            <i class="bi bi-house-door-fill"></i>

            Dashboard

        </a>


        <!-- My Milk -->

        <a href="{% url 'customer_milk_history' %}"
        class="{% if request.resolver_match.url_name == 'customer_milk_history' %}active{% endif %}">
            <i class="bi bi-droplet-half"></i>
            My Milk History
        </a>


        <!-- My Bills -->

        <a href="{% url 'customer_bills' %}"
        class="{% if request.resolver_match.url_name == 'customer_bills' %}active{% endif %}">
            <i class="bi bi-receipt"></i>
            My Bills
        </a>

        <!-- My Profile -->

        <a href="{% url 'customer_profile' %}"
              class="{% if request.resolver_match.url_name == 'customer_profile' %}active{% endif %}">
            <i class="bi bi-person-fill"></i>

            My Profile

        </a>

    </div>


    <!-- Logout -->

    <div class="customer-logout">

    <hr>

        <a href="{% url 'customer_logout' %}">

            <i class="bi bi-box-arrow-right me-2"></i>

            Logout

        </a>

    </div>


</div>


<!-- =========================
     MAIN
========================= -->

<div class="customer-main">


    <!-- Header -->

    <div class="customer-header">

        <div class="customer-header-title">

            DairyFlow Customer Panel

        </div>


        <div class="text-success">

            <i class="bi bi-person-circle me-1"></i>

            Customer

        </div>

    </div>


    <!-- Messages -->

    <div class="customer-content">

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-success
                            alert-dismissible fade show">

                    {{ message }}

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        {% endif %}


        {% block content %}

        {% endblock %}

    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
