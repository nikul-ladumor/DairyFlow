{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DairyFlow Customer</title>


    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <link rel="stylesheet"
          href="{% static 'css/customer.css' %}">

</head>

<body>

<div class="customer-layout">

    <!-- ==================================================
         CUSTOMER SIDEBAR
    ================================================== -->

    <div class="customer-sidebar"
         id="customerSidebar">

        <!-- Close Button -->
        <button type="button"
                class="customer-sidebar-close"
                onclick="closeCustomerSidebar()">
            <i class="bi bi-x-lg"></i>
        </button>


        <!-- Logo -->
        <div class="customer-logo">
            <img src="{% static 'images/logo.jpeg' %}"
                 alt="DairyFlow Logo">
        </div>

        <hr>


        <!-- CUSTOMER MENU -->
        <div class="customer-menu">

            <a href="{% url 'customer_dashboard' %}"
               class="{% if request.resolver_match.url_name == 'customer_dashboard' %}active{% endif %}">
                <i class="bi bi-house-door-fill"></i>
                Dashboard
            </a>

            <a href="{% url 'customer_milk_history' %}"
               class="{% if request.resolver_match.url_name == 'customer_milk_history' %}active{% endif %}">
                <i class="bi bi-droplet-half"></i>
                My Milk History
            </a>

            <a href="{% url 'customer_bills' %}"
               class="{% if request.resolver_match.url_name == 'customer_bills' %}active{% endif %}">
                <i class="bi bi-receipt"></i>
                My Bills
            </a>

            <a href="{% url 'customer_profile' %}"
               class="{% if request.resolver_match.url_name == 'customer_profile' %}active{% endif %}">
                <i class="bi bi-person-fill"></i>
                My Profile
            </a>

        </div>


        <!-- SECURITY -->

        <div class="customer-menu-item">

            <a href="javascript:void(0);"
               class="security-menu {% if request.resolver_match.url_name == 'change_password' %}active{% endif %}"
               onclick="toggleSecurityMenu()">

                <i class="bi bi-shield-lock-fill"></i>

                <span>Security</span>

                <i class="bi bi-chevron-down ms-auto"
                   id="securityArrow"></i>

            </a>


            <div class="security-submenu
                        {% if request.resolver_match.url_name == 'change_password' %}show{% endif %}"
                 id="securitySubmenu">

                <a href="{% url 'change_password' %}"
                   class="{% if request.resolver_match.url_name == 'change_password' %}active{% endif %}">

                    <i class="bi bi-key-fill"></i>

                    <span>Change Password</span>

                </a>

            </div>

        </div>


        <!-- LOGOUT -->

        <div class="customer-logout">

            <hr>

            <a href="{% url 'customer_logout' %}">
                <i class="bi bi-box-arrow-right me-2"></i>
                Logout
            </a>

        </div>

    </div>


    <!-- ==================================================
         MOBILE SIDEBAR OVERLAY
    ================================================== -->

    <div class="customer-sidebar-overlay"
         id="customerSidebarOverlay"
         onclick="closeCustomerSidebar()">
    </div>


    <!-- ==================================================
         MAIN CONTENT
    ================================================== -->

    <div class="customer-main">

        <!-- HEADER -->

        <div class="customer-header">

            <div class="customer-header-left">

                <button type="button"
                        class="customer-mobile-menu-btn"
                        onclick="openCustomerSidebar()">

                    <i class="bi bi-list"></i>

                </button>

                <div class="customer-header-title">
                    DairyFlow Customer Panel
                </div>

            </div>


            <div class="text-success">

                <i class="bi bi-person-circle me-1"></i>

                Customer

            </div>

        </div>


        <!-- =========================
     MESSAGES + CONTENT
========================= -->

<div class="customer-content">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>

            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}

</div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Customer JS -->

<script src="{% static 'js/customer.js' %}"></script>

</body>

</html>
