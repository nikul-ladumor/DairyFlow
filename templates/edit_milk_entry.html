{% extends "base.html" %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-body p-4">

                    <h3 class="text-success mb-4">
                        <i class="bi bi-pencil-square me-2"></i>
                        Edit Milk Entry
                    </h3>
                    <hr>

                    <form method="post">

                        {% csrf_token %}

                        <!-- Customer -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Customer
                            </label>

                            <select class="form-select" name="customer">

                                <option value="">Select Customer</option>

                                {% for customer in customers %}

                                <option value="{{ customer.id }}"
                                    {% if customer.id == milk_entry.customer.id %}selected{% endif %}>

                                    {{ customer.customer_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Date
                            </label>

                            <input type="date"
                                   class="form-control"
                                   name="date"
                                   value="{{ milk_entry.date|date:'Y-m-d' }}">
                        </div>

                        <!-- Shift -->
                        <div class="mb-3">

                            <label class="form-label fw-bold d-block">
                                Shift
                            </label>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="shift"
                                       value="Morning"
                                       {% if milk_entry.shift == "Morning" %}checked{% endif %}>

                                <label class="form-check-label">
                                    Morning
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="shift"
                                       value="Evening"
                                       {% if milk_entry.shift == "Evening" %}checked{% endif %}>

                                <label class="form-check-label">
                                    Evening
                                </label>

                            </div>

                        </div>

                        <!-- Milk Quantity -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Milk Quantity (Liter)
                            </label>

                            <input type="number"
                                   class="form-control"
                                   name="milk_quantity"
                                   value="{{ milk_entry.milk_quantity }}">

                        </div>

                        <!-- Milk Type -->
                        <div class="mb-3">

                            <label class="form-label fw-bold d-block">
                                Milk Type
                            </label>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="milk_type"
                                       value="Cow"
                                       {% if milk_entry.milk_type == "Cow" %}checked{% endif %}>

                                <label class="form-check-label">
                                    Cow
                                </label>

                            </div>

                            <div class="form-check form-check-inline">

                                <input class="form-check-input"
                                       type="radio"
                                       name="milk_type"
                                       value="Buffalo"
                                       {% if milk_entry.milk_type == "Buffalo" %}checked{% endif %}>

                                <label class="form-check-label">
                                    Buffalo
                                </label>

                            </div>

                        </div>

                        <!-- Rate -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Rate
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   name="rate"
                                   value="{{ milk_entry.rate }}">

                        </div>

                        <!-- Button -->
                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-success px-5">

                                <i class="bi bi-pencil-square me-2"></i>

                                Update Milk Entry

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
